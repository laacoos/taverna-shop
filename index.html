<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16110d" />
  <title>Лавка Короля Селёдки</title>
  <style>
    :root { color-scheme: dark; --gold:#e4b866; --paper:#251b14; --ink:#f5ead6; --muted:#b9a58d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:15px/1.45 system-ui,-apple-system,sans-serif; color:var(--ink); background:radial-gradient(circle at 50% -10%,#4b3320 0,#1b1410 42%,#0f0c0a 100%); }
    main { width:min(100%,480px); margin:auto; padding:22px 16px 100px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
    .eyebrow { color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:4px 0 0; font:700 27px/1.05 Georgia,serif; }
    .balance { flex:none; padding:10px 13px; border:1px solid #725834; border-radius:14px; background:#201710cc; color:#ffd987; font-weight:800; }
    .notice { margin-bottom:18px; padding:12px 14px; border-left:3px solid var(--gold); border-radius:8px; background:#332619; color:#ddc8aa; }
    .grid { display:grid; gap:13px; }
    article { display:grid; grid-template-columns:76px 1fr; gap:14px; padding:13px; border:1px solid #493729; border-radius:18px; background:linear-gradient(145deg,#2c2119,#201711); box-shadow:0 12px 30px #0005; }
    .art { display:grid; place-items:center; min-height:92px; border-radius:13px; background:radial-gradient(circle,#654b2f,#2b2018 70%); font-size:38px; }
    h2 { margin:0 0 3px; font:700 18px/1.2 Georgia,serif; }
    p { margin:0; color:var(--muted); font-size:13px; }
    .meta { display:flex; justify-content:space-between; align-items:end; gap:10px; margin-top:12px; }
    .price { color:#ffd987; font-weight:800; }
    small { display:block; color:#8f7c68; }
    button { border:1px solid #d2a85e; border-radius:11px; padding:9px 13px; color:#20150c; background:linear-gradient(#f3cf83,#c99443); font-weight:900; cursor:pointer; }
    button:active { transform:translateY(1px); }
    nav { position:fixed; left:50%; bottom:0; translate:-50% 0; display:grid; grid-template-columns:repeat(3,1fr); width:min(100%,480px); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid #463529; background:#17110eef; backdrop-filter:blur(12px); }
    nav a { padding:7px; color:#95806a; text-align:center; text-decoration:none; font-size:12px; }
    nav a:first-child { color:var(--gold); }
    #toast { position:fixed; left:50%; bottom:80px; translate:-50% 14px; width:max-content; max-width:90%; padding:11px 16px; border-radius:12px; background:#eee0c5; color:#25180e; opacity:0; transition:.2s; pointer-events:none; }
    #toast.show { opacity:1; translate:-50% 0; }
  </style>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">Таверна & лавка</div><h1>Король Селёдки</h1></div><div class="balance">🪙 427</div></header>
    <div class="notice">Добро пожаловать, путник. Сегодня у торговца осталось несколько редких товаров.</div>
    <section class="grid" id="catalog"><div class="notice">Загружаю товары из лавки…</div></section>
  </main>
  <nav><a href="#">🏺<br>Лавка</a><a href="#">🎒<br>Инвентарь</a><a href="#">📜<br>История</a></nav>
  <div id="toast"></div>
  <script>
    const SUPABASE_URL='https://rwkxyczvwbhutapurcnz.supabase.co';
    const SUPABASE_KEY='sb_publishable_yKMJE73bhAeOna7HgjnRNA_iX0soiJT';
    const catalog=document.querySelector('#catalog');
    const toast=document.querySelector('#toast');

    function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
    function escapeHtml(value){const el=document.createElement('div');el.textContent=value??'';return el.innerHTML}
    function render(items){
      catalog.innerHTML=items.map(item=>`<article>
        <div class="art">${escapeHtml(item.emoji||'📦')}</div>
        <div><h2>${escapeHtml(item.name)}</h2><p>${escapeHtml(item.description)}</p>
        <div class="meta"><div><span class="price">${item.price} 🪙</span><small>Осталось: ${item.stock}</small></div>
        <button data-name="${escapeHtml(item.name)}" ${item.stock<1?'disabled':''}>${item.stock<1?'Продано':'Купить'}</button></div></div>
      </article>`).join('');
      catalog.querySelectorAll('button:not([disabled])').forEach(button=>button.addEventListener('click',()=>showToast('Следующий этап: покупка «'+button.dataset.name+'»')));
    }
    fetch(`${SUPABASE_URL}/rest/v1/items?select=id,name,description,emoji,price,stock&is_active=eq.true&order=created_at`,{headers:{apikey:SUPABASE_KEY}})
      .then(response=>{if(!response.ok)throw new Error('Не удалось загрузить каталог');return response.json()})
      .then(render)
      .catch(()=>{catalog.innerHTML='<div class="notice">Не удалось прочитать товары. Проверьте разрешение Supabase.</div>'});
  </script>
</body>
</html>
